<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02 · Material &amp; Cahaya</title>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { setup, loop, floor, PAGE_STYLE } from "./common.js";
      document.head.insertAdjacentHTML("beforeend", `<style>${PAGE_STYLE}
        .tags { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 10px; }
        .tags span { color: #f2f4f8; background: rgba(10,14,22,.72); padding: 5px 10px; border-radius: 6px; font: 13px system-ui; }
      </style>`);

      // Eksplorasi 2: perbandingan jenis material & sumber cahaya + bayangan
      const ctx = setup({
        title: "Eksplorasi 2 — Material & Pencahayaan",
        note: "Baris depan: jenis material (Basic → Physical)<br>Baris belakang: MeshStandardMaterial, roughness (kiri→kanan) × metalness<br>Cahaya: Hemisphere + Directional (bayangan) + PointLight + SpotLight",
        camPos: [0, 3.6, 8.2],
        target: [0, 0.9, 0],
        background: 0x10131a
      });
      const { scene } = ctx;
      floor(scene, 30, 0x6b6f78);

      scene.add(new THREE.HemisphereLight(0xcfdcff, 0x2b2218, 0.35));
      const sun = new THREE.DirectionalLight(0xfff1dc, 1.6);
      sun.position.set(-6, 8, 5);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
      scene.add(sun);

      const warm = new THREE.PointLight(0xff8a3d, 18, 8);
      warm.position.set(3.8, 1.6, 1.6);
      scene.add(warm);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 8), new THREE.MeshBasicMaterial({ color: 0xffb070 }));
      bulb.position.copy(warm.position);
      scene.add(bulb);

      const spot = new THREE.SpotLight(0x7fb4ff, 40, 12, 0.35, 0.5);
      spot.position.set(-4, 5, 2);
      spot.target.position.set(-3, 0, -1.5);
      spot.castShadow = true;
      scene.add(spot, spot.target);

      // Baris depan: lima jenis material dengan warna yang sama
      const color = 0xd94f3d;
      const front = [
        ["MeshBasicMaterial", new THREE.MeshBasicMaterial({ color })],
        ["MeshLambertMaterial", new THREE.MeshLambertMaterial({ color })],
        ["MeshPhongMaterial", new THREE.MeshPhongMaterial({ color, shininess: 80 })],
        ["MeshStandardMaterial", new THREE.MeshStandardMaterial({ color, roughness: 0.35 })],
        ["MeshPhysicalMaterial (clearcoat)", new THREE.MeshPhysicalMaterial({ color, roughness: 0.5, clearcoat: 1, clearcoatRoughness: 0.05 })]
      ];
      const geo = new THREE.SphereGeometry(0.55, 64, 32);
      front.forEach(([, m], i) => {
        const s = new THREE.Mesh(geo, m);
        s.position.set((i - 2) * 1.6, 0.55, 1.4);
        s.castShadow = s.receiveShadow = true;
        scene.add(s);
      });
      const tags = document.createElement("div");
      tags.className = "tags";
      tags.innerHTML = front.map(([n]) => `<span>${n}</span>`).join("");
      document.body.appendChild(tags);

      // Baris belakang: grid roughness × metalness (PBR)
      for (let r = 0; r < 5; r++) {
        for (let k = 0; k < 2; k++) {
          const m = new THREE.MeshStandardMaterial({ color: 0xc9ccd2, roughness: 0.05 + r * 0.22, metalness: k });
          const s = new THREE.Mesh(new THREE.SphereGeometry(0.32, 48, 24), m);
          s.position.set((r - 2) * 1.0, 0.32 + k * 0.72, -1.3 - k * 0.2);
          s.castShadow = true;
          scene.add(s);
        }
      }
      // Lingkungan sederhana agar material metal punya sesuatu untuk dipantulkan
      const pmrem = new THREE.PMREMGenerator(ctx.renderer);
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x30384a);
      const panel = new THREE.Mesh(new THREE.PlaneGeometry(6, 2), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
      panel.position.set(0, 4, 0);
      panel.rotation.x = Math.PI / 2;
      envScene.add(panel);
      scene.environment = pmrem.fromScene(envScene, 0.04).texture;
      scene.environmentIntensity = 0.5;

      loop(ctx, (t) => {
        warm.position.x = 3.8 + Math.sin(t) * 0.6;
        bulb.position.copy(warm.position);
      });
    </script>
  </body>
</html>
